name: Build landing page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair unavailable icon import
        if: github.event_name == 'push'
        run: |
          sed -i '/  SteeringWheel,/d; s/SteeringWheel/Gauge/g' src/App.jsx
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/App.jsx
            git commit -m 'fix: use available lucide icon [skip ci]'
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
